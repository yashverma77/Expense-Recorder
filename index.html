<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker Pro Dashboard</title>
    <link rel="stylesheet" href="assets/css/main.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div id="app-loader" class="app-loader">Loading dashboard…</div>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <h2>ExpensePro</h2>
        <button id="mobile-nav-close" class="ghost">✕</button>
        <nav>
          <a href="#overview">Overview</a>
          <a href="#transactions">Transactions</a>
          <a href="#categories">Categories</a>
          <a href="#analytics">Analytics</a>
        </nav>
        <div class="sidebar-actions">
          <button id="theme-toggle" class="btn">Toggle Theme</button>
          <button id="clear-all" class="danger">Clear Data</button>
        </div>
      </aside>

      <main class="content">
        <header class="topbar">
          <button id="mobile-nav-open" class="ghost">☰</button>
          <h1>Finance Dashboard</h1>
          <div class="toolbar">
            <input id="search" type="search" placeholder="Search transactions" />
            <select id="range-filter">
              <option value="all">All</option>
              <option value="day">Today</option>
              <option value="month">This Month</option>
              <option value="year">This Year</option>
              <option value="custom">Custom Range</option>
            </select>
            <input id="from-date" type="date" />
            <input id="to-date" type="date" />
            <select id="sort-by">
              <option value="newest">Newest</option>
              <option value="oldest">Oldest</option>
              <option value="amount-desc">Amount High</option>
              <option value="amount-asc">Amount Low</option>
            </select>
          </div>
        </header>

        <section id="overview" class="cards"></section>

        <section class="panel form-panel">
          <h2>Add Transaction</h2>
          <form id="transaction-form">
            <input name="title" placeholder="Title" required maxlength="80" />
            <input name="amount" type="number" min="0.01" step="0.01" placeholder="Amount" required />
            <select name="type" required>
              <option value="income">Income</option>
              <option value="expense">Expense</option>
            </select>
            <select name="category" id="category-select" required></select>
            <input name="date" type="date" required />
            <input name="notes" placeholder="Notes (optional)" maxlength="120" />
            <button class="btn" type="submit">Save</button>
          </form>
          <div class="actions">
            <button id="export-csv" class="btn">Export CSV</button>
            <label class="btn upload-btn">Import JSON<input id="import-json" type="file" accept="application/json" /></label>
          </div>
        </section>

        <section id="categories" class="panel">
          <h2>Category Management</h2>
          <form id="category-form">
            <input name="categoryName" placeholder="New category" maxlength="30" required />
            <button class="btn" type="submit">Add Category</button>
          </form>
          <ul id="category-list" class="category-list"></ul>
        </section>

        <section id="transactions" class="panel">
          <h2>Recent Transactions</h2>
          <div id="empty-state" class="empty-state hidden">No transactions found.</div>
          <table>
            <thead>
              <tr>
                <th>Title</th><th>Category</th><th>Type</th><th>Date</th><th>Amount</th><th>Actions</th>
              </tr>
            </thead>
            <tbody id="transaction-body"></tbody>
          </table>
        </section>

        <section id="analytics" class="grid-2">
          <div class="panel"><canvas id="pieChart"></canvas></div>
          <div class="panel"><canvas id="lineChart"></canvas></div>
          <div class="panel"><canvas id="barChart"></canvas></div>
          <div class="panel"><canvas id="donutChart"></canvas></div>
        </section>
      </main>
    </div>

    <div id="confirm-modal" class="modal hidden">
      <div class="modal-card">
        <p id="confirm-message">Are you sure?</p>
        <div class="actions">
          <button id="confirm-ok" class="danger">Confirm</button>
          <button id="confirm-cancel" class="ghost">Cancel</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="assets/js/main.js"></script>
  </body>
</html>
